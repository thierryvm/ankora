name: CI

# Le push doit déclencher sur TOUTE branche, pas seulement main/develop.
#
# Mesuré le 1er août 2026 : les quatre lots livrés ce jour-là — chantier1,
# chantier2, qa-agents-hardening, fix/auth-only — n'ont déclenché AUCUN run.
# Zéro, sur les quatre. Aucun ne visait main/develop en push, aucun n'avait de
# PR ouverte, donc ni l'un ni l'autre des deux déclencheurs ne pouvait s'armer.
# Le dernier run vert datait du 27 juillet. Deux specs e2e cassées par la refonte
# de chantier2 sont restées invisibles jusqu'à ce que le merge atterrisse sur
# main — c'est-à-dire jusqu'à ce qu'elles soient EN PRODUCTION.
#
# Une CI qui ne s'exécute qu'après le merge n'est pas une CI, c'est un constat
# d'échec a posteriori. Le coût est nul ici : dépôt public, minutes GitHub
# gratuites, et `lighthouse` reste gardé sur `refs/heads/main` (voir son `if:`),
# donc aucune branche ne déclenche l'audit de la production.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

# `head_ref || ref` plutôt que `ref` seul : sur une branche portant une PR, les
# événements `push` et `pull_request` produisent deux refs différentes et donc
# deux runs concurrents du même code. Les regrouper sous le nom de branche fait
# que le second annule le premier, au lieu de payer deux fois.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Typecheck + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:use-server
      - run: npm run typecheck
      - run: npm run test -- --run --coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # BLOCKING gate — the surface actually shipped to users. `--omit=dev` keeps
      # build/runtime chains in scope (next, postcss, sharp… all reached through
      # production deps) while excluding pure dev tooling that never leaves the
      # repo. Rationale (2026-07-25, @thierry): the eslint chain carries a HIGH
      # `brace-expansion` advisory with NO applicable fix — the global override
      # breaks @eslint/config-array, and eslint@10 breaks the eslint-plugin-react
      # bundled inside eslint-config-next (upstream `context.getFilename()`
      # removal). Blocking every PR on an unfixable, non-shipped DoS helps nobody.
      - name: Audit production surface (blocking)
        run: npm audit --audit-level=high --omit=dev
      # NON-blocking visibility — we still want dev-tooling advisories in the log
      # so drift is noticed and re-checked whenever upstream ships a fix.
      - name: Audit dev tooling (informational)
        run: npm audit --audit-level=high || true

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # Pre-baked Playwright browsers eliminate the cdn.playwright.dev install
    # hang observed in PR #196 (runs 26594675820 cache-only CANCELLED 30m,
    # 26605442562 retry 3×12m FAILURE 38m). Image tag MUST match the
    # @playwright/test version resolved in package-lock.json (currently 1.59.1).
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 30
    needs: quality
    # Les six secrets `E2E_*` ci-dessous N'EXISTENT PAS dans ce dépôt, et c'est
    # voulu : ce job tourne délibérément contre un Supabase factice, les specs
    # authentifiées s'y excluent elles-mêmes par `test.skip(!admin, …)`, et la
    # valeur après `||` est le chemin nominal. L'extension GitHub Actions de
    # VS Code signale ces références comme « Context access might be invalid » —
    # elle a raison sur le fait et tort sur la conséquence.
    #
    # Le job authentifié plus bas ne lit AUCUN de ces secrets : il lance
    # `supabase start` et récupère les clés locales réelles depuis
    # `supabase status`. Ne pas « corriger » ces lignes en créant les secrets :
    # cela ferait tourner le job public contre une vraie base.
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_ENV: development
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'http://localhost:54321' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || 'dummy-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || 'dummy-service-role' }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.E2E_UPSTASH_URL || 'http://localhost:8079' }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.E2E_UPSTASH_TOKEN || 'dummy-token' }}
      INTERNAL_SECRET: ${{ secrets.E2E_INTERNAL_SECRET || 'dummy-secret-at-least-32-characters-long' }}
      # Playground route is server-only (no NEXT_PUBLIC_ prefix). Enabled in CI
      # so the smoke E2E `e2e/design-playground.spec.ts` can render the route
      # against the prod build (`npm run build && npm run start`). Production
      # deployments must NOT set this to 'true' unless intentionally exposing
      # the dev-only QA route. Cf. PR-D4-PHASE2-A Task 14 (route guard).
      ANKORA_PLAYGROUND_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start server
        run: npm run start &
      - name: Wait for server port
        # tcp:3000 avoids flakiness from root-path redirects or transient 500s
        # that would make an HTTP probe fail even when the server is up.
        run: npx wait-on tcp:3000 -t 60000
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-authenticated:
    name: Playwright E2E (authenticated)
    # NO `container:` here, unlike the job above — `supabase start` needs the
    # Docker daemon, and from inside a job container the Supabase containers
    # would be siblings on the host with `localhost:54421` routing nowhere.
    # The price is installing browsers rather than using the pre-baked image;
    # see the cache step.
    runs-on: ubuntu-latest
    # Sibling of `e2e`, NOT downstream of it: chaining would add ~7 minutes to
    # the critical path for nothing.
    needs: quality
    timeout-minutes: 25
    services:
      redis:
        image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
      # Speaks the Upstash REST protocol in front of a plain Redis, so
      # `rateLimit()` is genuinely exercised instead of bypassed. Without it the
      # limiter fails closed (NODE_ENV=production under `next start`) and every
      # mutation returns "service unavailable" — not just logins.
      #
      # The image has not been pushed since 2024-05-11, which is why it is
      # pinned by digest and why compatibility was measured rather than assumed:
      # `Ratelimit.slidingWindow(5, '15 m')` allows 5 calls and refuses the 6th
      # through it, exactly as against Upstash. If a future @upstash/ratelimit
      # release breaks that, this job goes red loudly and the fallback is a
      # dedicated free Upstash database via the E2E_UPSTASH_* secrets the `e2e`
      # job already reads.
      srh:
        image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-local-not-a-secret
          SRH_CONNECTION_STRING: 'redis://redis:6379'
        # Mandatory: without `container:` on the job, service containers are not
        # reachable over localhost unless their port is published. SRH listens on
        # 80 inside the container; the Next server runs on the HOST and reaches it
        # at localhost:8079. SRH itself reaches Redis by service name, on the job
        # network. Two different address spaces in one job — confusing them is the
        # likeliest way to break this.
        ports:
          - 8079:80
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_ENV: development
      # Ports are shifted off the Supabase defaults, matching supabase/config.toml.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54421
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: ci-local-not-a-secret
      INTERNAL_SECRET: ci-secret-at-least-32-characters-long
      # Says "a real Supabase is up" — `adminClientOrNull()` no longer guesses
      # from the URL, and now throws rather than skipping if that claim is false.
      E2E_SUPABASE_READY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Fails in seconds if the authenticated spec list drifted from the
      # committed one, in either direction. Before anything expensive runs.
      - name: Verify authenticated spec selection
        run: node scripts/e2e-auth-specs.mjs

      # Browsers and system deps are cached SEPARATELY: actions/cache restores
      # ~/.cache/ms-playwright, but apt packages live outside it and must be
      # installed every run regardless.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium webkit
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit

      - uses: supabase/setup-cli@v3
        with:
          # Pinned, not `latest`: this job is a gate, and a gate whose toolchain
          # changes under it cannot be trusted. 2.84.2 is the version the local
          # stack and the migration replay were verified against.
          version: 2.84.2
      # Applies the 15 migrations to an empty database on first boot. That this
      # succeeds is itself a result: production only ever received them
      # incrementally, so replayability had never been verified anywhere.
      - name: Start local Supabase stack
        run: supabase start
      # The local anon and service_role keys are Supabase's fixed published demo
      # values, identical on every machine — not secrets. Read at runtime anyway,
      # so no key literal lives in this repository.
      - name: Export local Supabase keys
        run: |
          supabase status -o json > /tmp/supabase-status.json
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r .ANON_KEY /tmp/supabase-status.json)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r .SERVICE_ROLE_KEY /tmp/supabase-status.json)" >> "$GITHUB_ENV"

      # NEXT_PUBLIC_* values are inlined at build time, so the stack must be up
      # before this runs.
      - run: npm run build
      - name: Start server
        run: npm run start &
      - name: Wait for server port
        run: npx wait-on tcp:3000 -t 60000

      # Two projects rather than all six: chromium-desktop for the desktop
      # journeys, iPhone 14 for the WebKit ones under e2e/mobile-ios/. Running
      # every project would triple the wall time before anyone has measured what
      # this job actually costs. Widening is an increase, which D6 allows; this
      # is the floor, not a ceiling.
      - name: Run authenticated specs
        run: npx playwright test $(node scripts/e2e-auth-specs.mjs --list | tr '\n' ' ') --project=chromium-desktop --project="iPhone 14" --reporter=list

      - name: Supabase logs on failure
        if: failure()
        run: supabase status || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-authenticated
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Audits the live production deployment only. Previews are SSO-protected
    # and a local build running with dummy Supabase creds returns 500.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wait for Vercel production deploy
        # Polls the GitHub Deployments API rather than the Vercel API directly.
        # Rationale (PR-QA-1c-0, 4 mai 2026): the previous Vercel-API filter
        # `meta.githubCommitSha == $sha AND target == 'production'` consistently
        # missed the deploy even after Vercel reported it as success — likely a
        # field-naming or target-naming mismatch on Vercel's side. GitHub
        # Deployments API exposes the same data (Vercel pushes to it) and is
        # accessible with the workflow's GITHUB_TOKEN, no extra secrets needed.
        # The deployment status `success` corresponds to Vercel `readyState=READY`.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          for i in $(seq 1 60); do
            # Reset on each iteration so the log line below cannot show a
            # stale value from a previous loop when this iteration finds no
            # deployment yet (Sourcery feedback, PR #110).
            state=""
            deployment_id=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/deployments?ref=$COMMIT_SHA&environment=Production&per_page=1" \
              | jq -r '.[0].id // empty') || true
            if [ -n "$deployment_id" ]; then
              state=$(curl -sf \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/deployments/$deployment_id/statuses?per_page=1" \
                | jq -r '.[0].state // empty') || true
              if [ "$state" = "success" ]; then
                echo "Production deploy succeeded for $COMMIT_SHA (deployment id=$deployment_id)"
                exit 0
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "Production deploy FAILED for $COMMIT_SHA (state=$state)" >&2
                exit 1
              fi
            fi
            echo "Waiting for production deploy ($i/60, current state=${state:-pending})…"
            sleep 10
          done
          echo "Timeout: no production deployment reached state=success for $COMMIT_SHA" >&2
          exit 1
      - name: Run Lighthouse against canonical production URL
        # The deployment-specific *.vercel.app hostname is gated by Vercel SSO
        # (Deployment Protection), so Lighthouse hits the login page and every
        # perf/a11y assertion fails. The canonical alias skips the gate.
        run: npm run lhci -- --collect.url="https://ankora-chi.vercel.app/"
